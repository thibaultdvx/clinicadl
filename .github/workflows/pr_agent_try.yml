name: Try LLM connection

on:
  workflow_dispatch:

jobs:
  pr_agent_job:
    runs-on: self-hosted
    steps:
      - name: Try to connect to API
        env:
          OPENAI__KEY: ${{ secrets.OPENAI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.OPENAI_KEY }}
          MISTRAL_API_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: ${{ secrets.LLM_API }}
        run: |
          curl -k "$OPENAI__API_BASE/chat/completions" -H "Authorization: Bearer $OPENAI__KEY" -H "Content-Type: application/json" -d "{\"model\": \"anthropic/claude-sonnet-4-5\", \"messages\": [{\"role\": \"user\", \"content\": \"Bonjour !\"}]}"
