name: PR Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr_agent_job:
    if: >-
      github.event.issue.pull_request &&
      (
        startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/improve') ||
        startsWith(github.event.comment.body, '/describe')
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: self-hosted
    steps:
      - name: Check PR-Agent installation
        run: |
          VENV="$RUNNER_TEMP/../../venv/pr-agent"

          if [ ! -x "$VENV/bin/python" ] ||
             ! "$VENV/bin/python" -m pip show pr-agent >/dev/null 2>&1; then
            echo "PR-Agent is not installed in $VENV" >&2
            exit 1
          fi

          # to make the variable available to subsequent steps
          echo "VENV=$VENV" >> "$GITHUB_ENV"

      - name: Run PR-Agent command
        env:
          PR_URL: ${{ github.event.issue.pull_request.html_url }}
          COMMAND: ${{ github.event.comment.body }}
          GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.OPENAI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.OPENAI_KEY }}
          MISTRAL_API_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: ${{ secrets.LLM_API }}
          SSL_VERIFY: "false"
        run: |
          "$VENV/bin/python" -m pr_agent.cli \
            --pr_url "$PR_URL" "${COMMAND#/}"
