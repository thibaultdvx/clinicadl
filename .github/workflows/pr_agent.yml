name: PR Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr_agent_job:
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.body == '/review' ||
       github.event.comment.body == '/improve' ||
       github.event.comment.body == '/describe') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: self-hosted
    steps:
      - name: Install PR-Agent
        run: |
          python3 -m venv "$RUNNER_TEMP/pr-agent-venv"
          "$RUNNER_TEMP/pr-agent-venv/bin/python" -m pip install pr-agent

      - name: Run PR-Agent command
        env:
          PR_URL: ${{ github.event.issue.pull_request.html_url }}
          COMMAND: ${{ github.event.comment.body }}
          GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: ${{ secrets.LLM_API }}
          SSL_VERIFY: "false"
        run: |
          "$RUNNER_TEMP/pr-agent-venv/bin/python" -m pr_agent.cli \
            --pr_url "$PR_URL" "${COMMAND#/}"
